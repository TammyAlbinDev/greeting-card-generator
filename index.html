<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Greeting Card Generator</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2.1.1/css/pico.classless.min.css">
<link rel="stylesheet" href="style.css">    
</head>
<body>
  <header>
    <h1>My Greeting Card Generator</h1>
  </header>

  <main>
    <section id="order-section">
      <h2>Order a card</h2>

      <label>A name
        <input id="name-input" type="text">
      </label>

      <label>An adjective
        <input id="adjective-input" type="text">
      </label>

      <label>A noun
        <input id="noun-input" type="text">
      </label>

      <button type="button" id="make-button">Make my card</button>
    </section>
      <button type="button" id="reset-button">Reset</button>

    <section id="card-section"hidden>
      <article>
        <p id="card-text">Your card will appear here.           </p>
	<p id="closing-text"></p>
    <p id="bonus-line" hidden> You made five cards - here's your surprise!</p>
   </article>
   </section>
	<button type="button" id="surprise-button">Surprise me</button>

  </main>

  <script src="card.js"></script>
</body>
</html>
